name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run format
      - name: Run credential-free PowerShell tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.6.1
          ./tests/pester/Run-Tests.ps1
      - name: Compile Bicep without deploying
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          while IFS= read -r -d '' file; do
            output="${RUNNER_TEMP}/bicep/${file#infra/bicep/}.json"
            mkdir -p "$(dirname "$output")"
            az bicep build --file "$file" --outfile "$output"
          done < <(find infra/bicep -name '*.bicep' -print0)
