name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate continuous-observer workflow contexts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/mining-continuous-flow-observer.yml
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm test
      - run: node --test scripts/simulate/observe-mining-continuous.test.mjs
      - run: npm run lint
      - run: npm run format
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/fabric/requirements-mining-snapshot.txt
      - name: Verify exact-string snapshot Parquet writer
        run: |
          python -m pip install --only-binary=:all: -r scripts/fabric/requirements-mining-snapshot.txt
          python tests/python/test_mining_snapshot_parquet.py
      - name: Test read-only Mining legacy Data Agent proof offline
        run: python -B -m unittest discover -s tests/python -p test_mining_legacy_agent_proof.py
      - name: Run credential-free PowerShell tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.6.1
          ./tests/pester/Run-Tests.ps1
      - name: Compile Bicep without deploying
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          while IFS= read -r -d '' file; do
            output="${RUNNER_TEMP}/bicep/${file#infra/bicep/}.json"
            mkdir -p "$(dirname "$output")"
            az bicep build --file "$file" --outfile "$output"
          done < <(find infra/bicep -name '*.bicep' -print0)
