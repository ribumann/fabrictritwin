[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Published Azure built-in Key Vault role definition IDs, not credentials"
condition = "AND"
paths = ['''infra[/\\]bicep[/\\]modules[/\\]key-vault\.bicep$''']
regexTarget = "secret"
regexes = [
  '''^4633458b-17de-408a-b874-0445c86b69e6$''',
  '''^b86a8fe4-44ce-4948-aee5-eccb2c155cd7$''',
]
