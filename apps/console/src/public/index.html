<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Triathlon Training Twin -- Demo Control Console</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; color: #1b1b1b; }
    h1 { font-size: 1.75rem; }
    button { font-size: 1rem; padding: 0.6rem 1.2rem; margin-right: 0.5rem; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    #status { margin-top: 1.5rem; padding: 0.75rem; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; }
    .status-ok { background: #e6f4ea; color: #1e4620; }
    .status-error { background: #fce8e6; color: #7a1712; }
  </style>
</head>
<body>
  <h1>Demo Control Console</h1>
  <p>Manually trigger Triathlon Training Twin demo activities.</p>
  <button id="seed-history-btn" type="button">Seed History</button>
  <button id="trigger-session-btn" type="button">Trigger Session</button>
  <button id="trigger-race-btn" type="button">Trigger Race</button>
  <div id="status" hidden></div>

  <script>
    const statusEl = document.getElementById("status");

    function showStatus(ok, text) {
      statusEl.hidden = false;
      statusEl.className = ok ? "status-ok" : "status-error";
      statusEl.textContent = text;
    }

    function wireTriggerButton(buttonId, path, label, buildBody) {
      const button = document.getElementById(buttonId);
      button.addEventListener("click", async () => {
        button.disabled = true;
        showStatus(true, `${label}...`);
        try {
          const response = await fetch(path, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(buildBody ? await buildBody() : {}),
          });
          const body = await response.json().catch(() => ({}));
          showStatus(response.ok, `HTTP ${response.status}\n${JSON.stringify(body, null, 2)}`);
        } catch (error) {
          showStatus(false, `Request failed: ${error instanceof Error ? error.message : String(error)}`);
        } finally {
          button.disabled = false;
        }
      });
    }

    wireTriggerButton("seed-history-btn", "/actions/seed-history", "Seeding history");
    wireTriggerButton("trigger-session-btn", "/actions/trigger-session", "Triggering session");
    wireTriggerButton("trigger-race-btn", "/actions/trigger-race", "Triggering race", async () => {
      // Pre-fill with the seeded athlete's real "goal race" id (any value technically works --
      // the Streaming Backend does not validate raceId against a Race entity today -- but
      // guessing a value the operator has no way of knowing was confusing). Falls back to a
      // blank prompt if the lookup fails, so the button still works offline/misconfigured.
      let defaultRaceId = "";
      try {
        const lookup = await fetch("/actions/default-race-id");
        if (lookup.ok) {
          const body = await lookup.json();
          defaultRaceId = body.raceId ?? "";
        }
      } catch {
        // Ignored -- falls back to a blank prompt below.
      }
      const raceId = window.prompt(
        "Race ID to trigger (pre-filled with the athlete's goal race; any value works):",
        defaultRaceId,
      );
      return raceId ? { raceId } : {};
    });
  </script>
</body>
</html>
